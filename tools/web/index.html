<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OK影视 · 接口中枢</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(10,16,28,.72); --line:rgba(0,255,170,.18);
    --green:#28ffbf; --purple:#b98bff; --red:#ff4d6d; --amber:#ffc857;
    --txt:#d8f5ee; --dim:#6d8f95;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;min-height:100vh;color:var(--txt);
    font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
    background:
      radial-gradient(1100px 600px at 12% -10%,rgba(40,255,191,.10),transparent 60%),
      radial-gradient(900px 500px at 92% 8%,rgba(185,139,255,.12),transparent 60%),
      var(--bg);
  }
  h1{font-size:26px;margin:0 0 4px;letter-spacing:2px;color:var(--green);
     text-shadow:0 0 12px rgba(40,255,191,.65)}
  h1 span{color:var(--purple);text-shadow:0 0 12px rgba(185,139,255,.65)}
  .sub{color:var(--dim);font-size:12px;letter-spacing:1px;margin-bottom:18px}
  .wrap{max-width:1240px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(40,255,191,.07),inset 0 0 18px rgba(40,255,191,.03);
  }
  .card .k{font-size:11px;color:var(--dim);letter-spacing:1.5px}
  .card .v{font-size:26px;font-weight:700;margin-top:6px;color:var(--green);
           text-shadow:0 0 10px rgba(40,255,191,.5)}
  .card .v.p{color:var(--purple);text-shadow:0 0 10px rgba(185,139,255,.5)}
  .card .v.r{color:var(--red);text-shadow:0 0 10px rgba(255,77,109,.5)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
  button{
    background:rgba(40,255,191,.06);color:var(--green);border:1px solid rgba(40,255,191,.45);
    border-radius:8px;padding:9px 18px;font:inherit;font-size:13px;cursor:pointer;
    text-shadow:0 0 8px rgba(40,255,191,.6);box-shadow:0 0 14px rgba(40,255,191,.14),inset 0 0 10px rgba(40,255,191,.06);
    transition:.18s;
  }
  button:hover{background:rgba(40,255,191,.16);box-shadow:0 0 22px rgba(40,255,191,.4)}
  button.pp{color:var(--purple);border-color:rgba(185,139,255,.45);
            text-shadow:0 0 8px rgba(185,139,255,.6);box-shadow:0 0 14px rgba(185,139,255,.14)}
  button.pp:hover{background:rgba(185,139,255,.16);box-shadow:0 0 22px rgba(185,139,255,.4)}
  button.on{background:rgba(40,255,191,.22);border-color:var(--green)}
  select,input{
    background:rgba(6,12,20,.9);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font:inherit;font-size:13px;outline:none;
  }
  input:focus,select:focus{border-color:var(--green);box-shadow:0 0 14px rgba(40,255,191,.28)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(40,255,191,.10)}
  th{color:var(--purple);font-size:11px;letter-spacing:1.4px;font-weight:600;
     text-shadow:0 0 8px rgba(185,139,255,.45)}
  tr:hover td{background:rgba(40,255,191,.035)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .ok{background:var(--green);box-shadow:0 0 9px var(--green)}
  .bad{background:var(--red);box-shadow:0 0 9px var(--red)}
  .unk{background:var(--dim)}
  .tag{color:var(--purple);font-weight:700}
  .url{color:var(--txt);word-break:break-all}
  .ms{color:var(--dim)}
  .vs-ok{color:var(--green);text-shadow:0 0 8px rgba(40,255,191,.45);font-weight:600}
  .vs-bad{color:var(--red);text-shadow:0 0 8px rgba(255,77,109,.45);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:14px 16px;margin-top:18px;backdrop-filter:blur(8px)}
  .panel h2{font-size:13px;letter-spacing:2px;color:var(--purple);margin:0 0 12px;
            text-shadow:0 0 10px rgba(185,139,255,.5)}
  .logs{max-height:260px;overflow:auto;font-size:12px;line-height:1.85}
  .logs div{color:var(--dim)}
  .logs b{color:var(--green);font-weight:600}
  .logs i{color:var(--purple);font-style:normal}
  .cfg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .cfg code{background:rgba(6,12,20,.9);border:1px solid var(--line);border-radius:7px;
            padding:8px 12px;color:var(--green);font-size:13px;word-break:break-all;
            text-shadow:0 0 8px rgba(40,255,191,.45)}
  .dom{font-size:11.5px;line-height:1.9}
  .dom .d{display:flex;gap:8px;align-items:center}
  .dom .rm{color:var(--red);cursor:pointer;font-size:11px;opacity:.6}
  .dom .rm:hover{opacity:1}
  .muted{color:var(--dim);font-size:11.5px}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spin{animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>OK影视 <span>· 接口中枢</span></h1>
  <div class="sub">OKTV-HUB &nbsp;/&nbsp; 接口地址池 + 健康巡检 + 上游热同步 + 网关反代</div>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <button onclick="act('/api/check',{},'巡检')">⚡ 一键巡检</button>
    <button onclick="act('/api/sync',{},'上游同步')" class="pp">⟳ 上游同步</button>
    <button onclick="act('/api/render',{},'重新生成')">▸ 重新生成配置</button>
    <button onclick="verifyPkg()" class="pp">🛡 与原版比对</button>
    <span class="muted">模式</span>
    <select id="mode" onchange="setMode(this.value)">
      <option value="direct">direct · 直连最优域名</option>
      <option value="dual">dual · 直连 + 网关备份（推荐）</option>
      <option value="gateway">gateway · 全部走网关</option>
    </select>
    <span id="busy" class="muted"></span>
  </div>

  <div class="panel">
    <h2>配置地址（填入 APP 的「点播接口」）</h2>
    <div class="cfg">
      <code id="cfgurl">-</code>
      <button onclick="copyCfg()">复制</button>
      <a href="/jsm.json" target="_blank" style="color:var(--purple);font-size:12px">预览 jsm.json ↗</a>
    </div>
    <div class="muted" style="margin-top:8px">相对路径的 pg.jar / js / lib 由本中枢一并托管，无需另装包。</div>
  </div>

  <div class="panel">
    <h2>接口源 · 域名池健康</h2>
    <div class="flex" style="margin-bottom:10px">
      <input id="ntag" placeholder="TAG 例如 WOGG" style="width:150px"/>
      <input id="nurl" placeholder="新增候选域名 http://..." style="width:300px"/>
      <button onclick="addDom()">＋ 加入池</button>
      <span class="muted">手工兜底：上游也找不到时自己补一个</span>
    </div>
    <table>
      <thead><tr>
        <th>TAG</th><th>名称</th><th>当前最优</th><th>存活/总数</th><th>域名明细</th>
      </tr></thead>
      <tbody id="pool"></tbody>
    </table>
  </div>

  <div class="panel" id="verifyPanel" style="display:none">
    <h2>与原版 pg 包一致性核对</h2>
    <div id="verifyHead" class="muted" style="margin-bottom:10px"></div>
    <table>
      <thead><tr><th>项目</th><th>原版</th><th>当前</th><th>结论</th></tr></thead>
      <tbody id="verifyBody"></tbody>
    </table>
    <div id="verifyExtra" class="muted" style="margin-top:10px;line-height:1.7"></div>
  </div>

  <div class="panel">
    <h2>事件日志</h2>
    <div class="logs" id="logs"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function busy(t){$('#busy').innerHTML=t?'<span class="spin">◌</span> '+t:''}

async function api(u,opt){const r=await fetch(u,opt);return r.json()}

async function refresh(){
  const st=await api('/api/status');
  const s=st.state||{};
  const alive=st.pool.domains_alive, total=st.pool.domains_total;
  $('#cfgurl').textContent=st.public_base?st.public_base+'/jsm.json':location.origin+'/jsm.json';
  $('#mode').value=s.mode||'direct';
  $('#cards').innerHTML=`
    <div class="card"><div class="k">接口源 TAG</div><div class="v">${st.tags}</div></div>
    <div class="card"><div class="k">域名存活</div><div class="v ${alive?'':'r'}">${alive}<span style="font-size:14px;color:var(--dim)">/${total}</span></div></div>
    <div class="card"><div class="k">配置站点数</div><div class="v p">${st.sites}</div></div>
    <div class="card"><div class="k">上次巡检</div><div class="v" style="font-size:15px">${ts(s.last_health)}</div></div>
    <div class="card"><div class="k">上次同步</div><div class="v" style="font-size:15px">${ts(s.last_sync)}</div></div>`;
  const pool=await api('/api/pool');
  $('#pool').innerHTML=pool.map(p=>`
    <tr>
      <td class="tag">${esc(p.tag)}</td>
      <td>${esc(p.name)}<div class="muted">${esc(p.api)}${p.proxy?' · '+esc(p.proxy):''}</div></td>
      <td class="url">${p.best?esc(p.best):'<span style="color:var(--red)">无可用</span>'}</td>
      <td>${p.alive}/${p.total}</td>
      <td class="dom">${p.domains.map(d=>`
        <div class="d"><span class="dot ${d.status==='alive'?'ok':(d.status==='dead'?'bad':'unk')}"></span>
        <span class="url">${esc(d.url)}</span>
        <span class="ms">${d.latency?d.latency+'ms':''} ${esc(d.note||'')}</span>
        <span class="rm" onclick="delDom('${esc(p.tag)}','${esc(d.url)}')">删除</span></div>`).join('')}</td>
    </tr>`).join('')||'<tr><td colspan="5" class="muted">加载中…</td></tr>';
  const logs=await api('/api/logs?n=80');
  $('#logs').innerHTML=logs.map(l=>`<div><i>${l.ts}</i> <b>${esc(l.kind)}</b> ${esc(l.msg)}</div>`).join('')||'<div class="muted">暂无</div>';
}

function ts(t){if(!t)return '—';const d=new Date(t*1000);
  return d.toLocaleTimeString('zh-CN',{hour12:false})}

async function act(url,body,name){
  busy(name+'中…');
  await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  busy('');refresh();
}
async function setMode(m){
  busy('切换模式…');
  await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
  busy('');refresh();
}
async function addDom(){
  const tag=$('#ntag').value.trim(),url=$('#nurl').value.trim();
  if(!tag||!url)return alert('TAG 和 域名 都要填');
  busy('探测新域名…');
  await fetch('/api/domains',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag,url})});
  $('#nurl').value='';busy('');refresh();
}
async function delDom(tag,url){
  if(!confirm('从池中删除 '+url+' ?'))return;
  await fetch('/api/domains',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag,url})});
  refresh();
}
function copyCfg(){navigator.clipboard.writeText($('#cfgurl').textContent);}

async function verifyPkg(){
  busy('与原版逐项比对中…');
  let d={};
  try{ d=await api('/api/verify?deep=1'); }catch(e){ busy(''); return alert('比对失败：'+e); }
  busy('');
  const panel=$('#verifyPanel'); panel.style.display='';
  const f=d.files||{}, s=d.sites||{};
  const rows=[];
  for(const k of ['lives','rules','parses','proxy','hosts','doh','flags']){
    const v=(d.fields||{})[k]||{};
    rows.push([k, v.original, v.now, !!v.same]);
  }
  for(const k of ['spider','wallpaper','disabled_wallpaper']){
    const v=(d.scalars||{})[k]||{};
    rows.push([k, v.original, v.now, !!v.same]);
  }
  rows.push(['sites', s.original, s.now, (s.missing_keys||[]).length===0 && (s.api_changed||[]).length===0 && (s.type_changed||[]).length===0]);
  rows.push(['资源文件', f.original, (f.original-(f.missing||[]).length), (f.missing||[]).length===0 && (f.size_diff||[]).length===0 && (f.hash_diff||[]).length===0]);

  $('#verifyBody').innerHTML = rows.map(([k,a,b,ok])=>
    `<tr><td class="tag">${esc(String(k))}</td><td>${esc(String(a))}</td><td>${esc(String(b))}</td>
     <td class="${ok?'vs-ok':'vs-bad'}">${ok?'一致':'差异'}</td></tr>`).join('');

  const head = d.core_ok
    ? `<span class="vs-ok">✔ 与原版逐项一致</span> &nbsp;—&nbsp; 仅替换了失效域名，直播/站点/字段/文件均未被精简`
    : `<span class="vs-bad">✘ 存在差异</span> &nbsp;—&nbsp; 请查看下方明细`;
  $('#verifyHead').innerHTML = head;

  const rw=(d.domain_rewritten||[]);
  $('#verifyExtra').innerHTML =
    `<div>预期内的修改：失效域名替换 <b class="vs-ok">${rw.length}</b> 条 &nbsp;|&nbsp; 标注失效的站点 <b>${(s.renamed||[]).length}</b> 个</div>`+
    (rw.length?`<div style="margin-top:6px">`+rw.map(r=>`· ${esc(String(r.key))}：${esc(String(r.original))} → <span class="vs-ok">${esc(String(r.now))}</span>`).join('<br>')+`</div>`:'')+
    (f.expected_extra&&f.expected_extra.length?`<div style="margin-top:6px">作者要求使用者自备、已代为生成的：${f.expected_extra.map(x=>`<code>${esc(x)}</code>`).join('、')}</div>`:'')+
    (f.unexpected_extra&&f.unexpected_extra.length?`<div style="margin-top:6px" class="vs-bad">非预期文件：${f.unexpected_extra.map(x=>`<code>${esc(x)}</code>`).join('、')}</div>`:'')+
    (d.hint?`<div style="margin-top:8px">${esc(String(d.hint))}</div>`:'');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

refresh();setInterval(refresh,20000);
</script>
</body>
</html>
