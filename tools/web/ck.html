<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hai 本地包 · 网盘 CK 捕获台</title>
<style>
:root{
  --bg:#080c0f; --panel:rgba(10,20,24,.86); --line:rgba(0,255,190,.18);
  --neon:#39ffbe; --neon2:#b06bff; --txt:#d8f5ee; --dim:#6e8f8a;
  --ok:#39ffbe; --bad:#ff5d6c; --warn:#ffc857; --idle:#7b8f9c;
}
*{box-sizing:border-box}
body{margin:0;padding:16px 14px 40px;background:
  radial-gradient(900px 520px at 12% -10%,rgba(0,255,190,.10),transparent 60%),
  radial-gradient(760px 460px at 100% 0,rgba(176,107,255,.10),transparent 60%),
  var(--bg);
  color:var(--txt);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
h1{font-size:19px;margin:2px 0 4px;letter-spacing:.5px;
  text-shadow:0 0 12px rgba(0,255,190,.55)}
h1 span{color:var(--neon2);text-shadow:0 0 12px rgba(176,107,255,.6)}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:14px;box-shadow:0 0 24px rgba(0,255,190,.06) inset}
label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 6px}
textarea,select{width:100%;background:rgba(0,0,0,.45);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:11px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
  outline:none;resize:vertical}
textarea:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,255,190,.14)}
textarea{min-height:96px}
select{font-family:inherit;margin-bottom:10px}
.row{display:flex;gap:10px;margin-top:10px}
button{flex:1;cursor:pointer;border:1px solid var(--neon);border-radius:10px;
  background:linear-gradient(180deg,rgba(0,255,190,.18),rgba(0,255,190,.06));
  color:var(--neon);font-size:15px;font-weight:600;padding:12px 8px;
  text-shadow:0 0 10px rgba(0,255,190,.7);box-shadow:0 0 16px rgba(0,255,190,.16);
  transition:.15s}
button:active{transform:scale(.985)}
button.ghost{border-color:rgba(176,107,255,.6);color:var(--neon2);
  background:linear-gradient(180deg,rgba(176,107,255,.16),rgba(176,107,255,.04));
  text-shadow:0 0 10px rgba(176,107,255,.7);box-shadow:0 0 16px rgba(176,107,255,.14)}
button[disabled]{opacity:.5}
.msg{margin-top:10px;font-size:13px;padding:10px 12px;border-radius:10px;display:none;
  white-space:pre-wrap;word-break:break-all}
.msg.ok{display:block;border:1px solid rgba(0,255,190,.4);background:rgba(0,255,190,.08);color:var(--ok)}
.msg.err{display:block;border:1px solid rgba(255,93,108,.45);background:rgba(255,93,108,.09);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:11.5px}
td.v{font-family:ui-monospace,Menlo,monospace;color:var(--dim);font-size:11.5px;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid}
.s-valid{color:var(--ok);border-color:rgba(0,255,190,.45);background:rgba(0,255,190,.10)}
.s-invalid{color:var(--bad);border-color:rgba(255,93,108,.45);background:rgba(255,93,108,.10)}
.s-unverified{color:var(--warn);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.10)}
.s-empty{color:var(--idle);border-color:rgba(255,255,255,.14)}
.hint{color:var(--dim);font-size:12px;margin-top:9px;line-height:1.7}
code{background:rgba(0,255,190,.09);color:var(--neon);padding:1px 5px;border-radius:5px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bar b{font-size:14px;font-weight:600;color:var(--neon)}
.del{cursor:pointer;color:var(--dim);border:1px solid rgba(255,255,255,.14);
  border-radius:6px;padding:1px 7px;font-size:11px;background:none}
.del:active{color:var(--bad);border-color:rgba(255,93,108,.5)}
</style>
</head>
<body>
<h1>hai 本地包 · <span>网盘 CK 捕获台</span></h1>
<div class="sub">在这里保存一次，局域网所有电视机/手机下次加载配置时自动生效</div>

<div class="panel">
  <label>粘贴 CK / Cookie / 请求链接 / tokenm.json（自动识别渠道）</label>
  <textarea id="raw" placeholder="例：
__pus=xxxxxxxx; __kp=yyyyyyyy; __uid=zzz        ← 夸克 Cookie 原串
quark_cookie=__pus=...; __kp=...               ← 带字段名
https://pan.quark.cn/...?cookie=...            ← 直接贴链接
{&quot;quark_cookie&quot;:&quot;...&quot;,&quot;baidu_cookie&quot;:&quot;...&quot;}   ← 整份配置"></textarea>
  <label style="margin-top:10px">渠道（自动识别不准时手动指定）</label>
  <select id="ch">
    <option value="">自动识别</option>
    <option value="quark">夸克网盘</option>
    <option value="uc">UC网盘</option>
    <option value="baidu">百度网盘</option>
    <option value="115">115网盘</option>
    <option value="aliyun">阿里云盘</option>
    <option value="thunder">迅雷云盘</option>
    <option value="yd">移动云盘</option>
    <option value="pikpak">PikPak</option>
    <option value="pan123">123云盘</option>
    <option value="pan189">天翼云盘</option>
    <option value="guangya">光雅网盘</option>
  </select>
  <div class="row">
    <button id="save">▸ 保存并同步</button>
    <button class="ghost" id="recheck">⟳ 重新校验</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hint">
    保存后会立即做一次网盘登录态校验：<br>
    能校验的渠道（夸克/UC/百度/115/123/189/阿里）判 <b>有效</b> 才会覆盖旧 CK；<br>
    判不了（迅雷/PikPak/移动/光雅 需客户端签名）标 <b>待验证</b>，不覆盖已验证的值。
  </div>
</div>

<div class="panel">
  <div class="bar">
    <b>当前保险库</b>
    <span style="color:var(--dim);font-size:12px" id="meta">—</span>
  </div>
  <table>
    <thead><tr><th>渠道</th><th>状态</th><th>值</th><th>来源 / 命中</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="hint" id="urls"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={valid:'有效',invalid:'已失效',unverified:'待验证',empty:'未配置'};

function basePrefix(){
  // /ck  或  /oktv/ck  ->  / 或 /oktv
  let p=location.pathname.replace(/\/ck\/?$/,'');
  if(p.endsWith('/'))p=p.slice(0,-1);
  return p;
}
async function jget(u){const r=await fetch(u,{cache:'no-store'});return r.json();}
async function jpost(u,body){
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  let d;try{d=await r.json()}catch(e){d={ok:false,error:'HTTP '+r.status}}
  if(!r.ok&&d.ok===undefined)d.ok=false;
  return d;
}
function say(t,ok){const m=$('#msg');m.className='msg '+(ok?'ok':'err');m.textContent=t;}

async function load(){
  try{
    const d=await jget('api/ck');
    $('#meta').textContent=`v${d.version} · 已配置 ${d.configured} · 有效 ${d.valid} · 注入字段 ${d.injected_fields}`;
    $('#rows').innerHTML=(d.rows||[]).map(r=>`<tr>
      <td>${esc(r.label)}</td>
      <td><span class="chip s-${esc(r.state)}">${esc(ST[r.state]||r.state)}</span></td>
      <td class="v" title="${esc(r.masked)}">${esc(r.masked||'-')}</td>
      <td class="v" title="${esc(r.source)}">${esc((r.source||'-').slice(0,26))}${r.hits?' · '+r.hits+'次':''}</td>
      <td>${r.state==='empty'?'':`<button class="del" data-ch="${esc(r.channel)}">删</button>`}</td>
    </tr>`).join('');
    document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
      if(!confirm('确定删除 '+b.dataset.ch+' 的 CK？'))return;
      await jpost('api/ck/drop?ch='+encodeURIComponent(b.dataset.ch));
      load();
    });
    const pre=basePrefix();
    const cfg=location.origin+pre+'/hai/jsm.json';
    $('#urls').innerHTML='电视机里填这个配置地址：<br><code>'+esc(cfg)+'</code><br>'+
      '（局域网直连也行：<code>http://10.0.0.11:8099/hai/jsm.json</code>）';
  }catch(e){
    $('#meta').textContent='读取失败';
  }
}

$('#save').onclick=async()=>{
  const raw=$('#raw').value.trim();
  if(!raw){say('先粘贴内容',false);return;}
  const ch=$('#ch').value;
  $('#save').disabled=true;say('提交中…',true);
  let d;
  if(ch){d=await jpost('api/ck/report',{channel:ch,value:raw});}
  else  {d=await jpost('api/ck/report',{raw:raw});}
  $('#save').disabled=false;
  if(d.ok){
    const rs=d.results||[];
    const lines=(Array.isArray(rs)?rs:[rs]).map(r=>
      (r.channel||'')+' → '+(r.action||'')+' ('+(r.state||'')+(r.note?' / '+r.note:'')+')');
    say('已保存 ✓ 版本 v'+d.version+'\n'+lines.join('\n'),true);
    $('#raw').value='';load();
  }else{say('保存失败：'+(d.error||'未知错误'),false);}
};

$('#recheck').onclick=async()=>{
  $('#recheck').disabled=true;say('校验中（需数秒）…',true);
  const d=await jpost('api/ck/check');
  $('#recheck').disabled=false;
  const lines=(d.results||[]).map(r=>(r.channel||'')+' → '+(r.state||'')+(r.note?' / '+r.note:''));
  say('校验完成 ✓\n'+(lines.join('\n')||'（无可校验渠道）'),true);
  load();
};

load();setInterval(load,20000);
</script>
</body>
</html>
